<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JavaScript and LocalStorage CRUD project</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Vanilla JavaScript and LocalStorage CRUD project</h1>

    <main class="layout">
        <section class="left">
            <form id="warehouseForm">
                <label for="productId">Product Code</label>
                <input type="text" id="productId" list="idList" inputmode="numeric" placeholder="only numbers...">
                <datalist id="idList"></datalist>

                <label for="productName">Product Name</label>
                <input type="text" id="productName">

                <label for="productQuantity">Product Quantity</label>
                <input type="number" id="productQuantity">

                <div class="buttons">
                    <button type="button" id="addProduct">Insert new</button>
                    <button type="button" id="editProduct">Edit item</button>
                    <button type="button" id="deleteProduct">Delete from LS</button>
                </div>
            </form>

            <p id="warehouseMessage" class="message"></p>

            <p id="warehouseEmpty" class="empty">No products in the warehouse yet.</p>
            <div class="table-wrap" id="warehouseTableBox" hidden>
                <table>
                    <thead><tr><th>Product Code</th><th>Product Name</th><th>Product Quantity</th></tr></thead>
                    <tbody id="warehouseTable"></tbody>
                </table>
            </div>
        </section>

        <section class="right">
            <h2>Find Product by Code</h2>

            <form id="findForm">
                <label for="findId">Product Code</label>
                <input type="text" id="findId" list="idList" inputmode="numeric" placeholder="only numbers...">

                <div class="buttons center">
                    <button type="button" id="findProduct">Select from LS</button>
                </div>
            </form>

            <p id="findMessage" class="message"></p>

            <p id="foundEmpty" class="empty">No products selected yet.</p>
            <div class="table-wrap" id="foundTableBox" hidden>
                <table>
                    <thead><tr><th>Product Code</th><th>Product Name</th><th>Product Quantity</th></tr></thead>
                    <tbody id="foundTable"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
