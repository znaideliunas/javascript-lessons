<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Warehouse</title>

    <script src="script.js" defer></script>
</head>
<body>

    <h1>Warehouse System</h1>
    <section>
        <h2>Product Warehouse</h2>

        <form id="warehouseForm">

            <label for="productId">Product code (ID):</label>
            <input type="text" id="productId" placeholder="Here goes your ID...">

            <label for="productName">Pavadinimas:</label>
            <input type="text" id="productName" placeholder="Enter thy Name...">

            <label for="productQuantity">Quantity:</label>
            <input type="number" id="productQuantity" placeholder="Enter quantity..">

            <button type="button" id="addProduct">Add Product</button>
            <button type="button" id="searchProduct">Search Product</button>
            <button type="button" id="editProduct">Edit Product</button>
            <button type="button" id="deleteProduct">Delete Product</button>

        </form>

        <p id="warehouseMessage">hiiii</p>

        <h3>Warehouse Products:</h3>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Pavadinimas</th>
                    <th>Kiekis</th>
                    <th>Veiksmai</th>
                </tr>
            </thead>

            <tbody id="warehouseTable">

            </tbody>
        </table>

    </section>



    <section>
        <h2>Product Cart</h2>

        <form id="cartForm">

            <label for="cartProductId">Product code (ID):</label>
            <input type="text" id="cartProductId" placeholder="Enter product ID">

            <br><br>

            <label for="cartQuantity">Quantity:</label>
            <input type="number" id="cartQuantity" placeholder="Enter quantity">

            <br><br>

            <button type="button" id="addToCart">Enter to add to your cart!</button>

        </form>

        <p id="cartMessage"></p>

        <h3>Your cart:</h3>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Quantity</th>
                </tr>
            </thead>

            <tbody id="cartTable">

            </tbody>
        </table>

    </section>

</body>
</html>
